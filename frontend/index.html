<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Perfil - MVC + Cloudinary</title>
  
  <!-- CSS de Dropzone (vía CDN) -->
  <link rel="stylesheet" href="https://unpkg.com/dropzone@5/dist/min/dropzone.min.css">
  
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 500px;
      margin: 2rem auto;
      padding: 1rem;
      background: #f5f5f7;
      color: #333;
    }
    h1 {
      text-align: center;
      margin-bottom: 2rem;
    }
    label {
      display: block;
      margin-top: 1rem;
      font-weight: 600;
      font-size: 0.9rem;
      color: #555;
    }
    input[type="text"],
    textarea {
      width: 100%;
      padding: 0.7rem;
      margin-top: 0.3rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
      font-family: inherit;
    }
    textarea {
      min-height: 80px;
      resize: vertical;
    }
    .dropzone {
      border: 2px dashed #b0b0b0;
      border-radius: 8px;
      padding: 1.5rem;
      text-align: center;
      background: #fff;
      margin-top: 0.5rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .dropzone:hover {
      border-color: #4a90e2;
      background: #f0f7ff;
    }
    #preview-container {
      display: none;
      text-align: center;
      margin-top: 1rem;
    }
    #preview {
      max-width: 150px;
      max-height: 150px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #4a90e2;
    }
    button {
      display: block;
      width: 100%;
      padding: 0.9rem;
      margin-top: 1.5rem;
      background: #4a90e2;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #357abd;
    }
    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }
    #status {
      text-align: center;
      margin-top: 1rem;
      font-size: 0.9rem;
      min-height: 1.2em;
    }
    .success { color: #2e7d32; }
    .error { color: #c62828; }
  </style>
</head>
<body>
  <h1>👤 Mi Perfil</h1>

  <form id="profile-form">
    <label for="name">Nombre</label>
    <input type="text" id="name" name="name" placeholder="Tu nombre completo" required>

    <label for="bio">Bio</label>
    <textarea id="bio" name="bio" placeholder="Contanos algo sobre vos..." required></textarea>

    <label>Foto de perfil</label>
    <div id="dropzone" class="dropzone">
      <p style="margin: 0; color: #666;">
        Arrastrá tu foto acá o hacé click para elegirla
      </p>
    </div>

    <div id="preview-container">
      <img id="preview" alt="Preview">
    </div>

    <button type="submit" id="submit-btn">Guardar</button>
  </form>

  <div id="status"></div>

  <!-- JS de Dropzone (vía CDN) -->
  <script src="https://unpkg.com/dropzone@5/dist/min/dropzone.min.js"></script>
  
  <!-- Nuestro código -->
  <script src="./index.js"></script>
</body>
</html>
